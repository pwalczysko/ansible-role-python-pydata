---
# tasks file for roles/python-pydata
- name : python pydata | check rocky.repo file
  stat:
    path: /etc/yum.repos.d/rocky.repo
  register: rockyrepo_name

- name: python pydata | install config-manager in rocky
  become: true
  ansible.builtin.dnf:
    name:
      - 'dnf-command(config-manager)'
    state: present
  when: rockyrepo_name.stat.exists

- name: python pydata | Enable CRB repo in rocky
  become: true
  ansible.builtin.replace:
    path:  /etc/yum.repos.d/rocky.repo
    # create: false
    regexp: enabled=0
    replace: enabled=1
    # state: present
  when: rockyrepo_name.stat.exists

- name: python pydata | Add repository for RHEL
  become: true
  ansible.builtin.command:
    subscription-manager repos --enable codeready-builder-for-rhel-9-x86_64-rpms
  when: ansible_os_family == 'RedHat' and not rockyrepo_name.stat.exists

- name: python pydata | Import a key for epel
  become: true
  ansible.builtin.rpm_key:
    state: present
    key:  https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-9

- name: python pydata | setup dnf repository
  become: true
  ansible.builtin.dnf:
    name:
      https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm
    state: present

- name: python pydata | install python3.12 packages
  become: true
  ansible.builtin.dnf:
    name:
      - "python3.12-devel.x86_64"
      - "python3.12"
      - "python3.12-pip"
      - "python3.12-setuptools"
    state: present

- name: python pydata | pip install packages
  become: true
  ansible.builtin.pip:
    name:
      - numpy
      - ipython
      - matplotlib
      - numexpr
      - scipy
      - pyyaml
      - pandas
      - tables
      - scikit-image
    state: present
  changed_when: false
